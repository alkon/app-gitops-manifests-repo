# Default values for the sealed-secrets-controller wrapper chart.
# These values will be passed to the 'sealed-secrets' sub-chart.

sealed-secrets:
  # Explicitly setting the image tag for the controller to avoid type mismatch errors.
  image:
    tag: "0.30.0" # This explicitly sets the image tag for the controller
    # repository: "bitnami-labs/sealed-secrets-controller" # This is the default, no need to uncomment unless overriding
    # registry: "ghcr.io" # This is the default, no need to uncomment unless overriding

  # To install the controller in the 'secrets-ns' namespace (as per your main.tf)
  # ensure the namespace is created, and if the chart has a namespace parameter, set it here.
  # Otherwise, ArgoCD's destination.namespace will handle it.
  # namespace: secrets-ns
