receiver:
  # Global settings
  global:
    namespace: thanos-ns
  
  # Object storage configuration for components that need it
  existingObjstoreSecret: thanos-objstore-secret

  # Disable all components except receive
  query:
    enabled: false
  queryFrontend:
    enabled: false
  bucketweb:
    enabled: false
  compactor:
    enabled: true
    
    # Retention configuration per resolution
    retentionResolutionRaw: 7d     # Keep raw data for 7 days
    retentionResolution5m: 30d     # Keep 5-minute downsampled data for 30 days  
    retentionResolution1h: 90d     # Keep 1-hour downsampled data for 90 days
    
    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 100m
    
    # Persistence for temporary data during compaction
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi
    
    # Service Account
    serviceAccount:
      create: true
      name: thanos-compactor-sa
    
    # Extra flags
    extraFlags:
      - --compact.concurrency=1
      - --delete-delay=48h
    
    # Use same AWS credentials
    extraEnvVarsSecret: aws-creds
  storegateway:
    enabled: false
  ruler:
    enabled: false
  receiveDistributor:
    enabled: false

  # Enable receive component
  receive:
    enabled: true

    # Service Account configuration (removed EKS-specific annotation for k3d)
    serviceAccount:
      create: true
      name: thanos-receiver-sa
      # The eks.amazonaws.com/role-arn annotation is removed for k3d clusters.

    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m

    # TSDB retention - how long to retain raw samples on Thanos Receiver's local TSDB
    tsdbRetention: 2d

    # Extra flags for the thanos receive command
    extraFlags:
      - --tsdb.max-exemplars=100000  # Correct flag for enabling exemplars
      # Point Thanos to the mounted object storage configuration file from the ConfigMap
      - --objstore.config-file=/etc/thanos/objstore.yml

    # Persistence configuration
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi

    # Service configuration
    service:
      type: ClusterIP
      ports:
        http: 10902
        grpc: 10901
        remote: 19291

    # Configure for remote write endpoint
    replicaLabel: replica

    # Auto-scaling configuration
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: 80

    # Inject the AWS credentials from the 'aws-creds' Secret as environment variables
    extraEnvVarsSecret: aws-creds

    # Volume mounts for the object storage configuration file
    extraVolumeMounts:
      - name: objstore-config
        mountPath: /etc/thanos/objstore.yml
        subPath: objstore.yml # Mounts only the file, not the directory

    # Define the volume for the object storage configuration ConfigMap
    extraVolumes:
      - name: objstore-config
        configMap:
          name: thanos-receiver-objstore-config # This name must match the ConfigMap manifest below

  # Common configuration
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.39.1-debian-12-r0
    pullPolicy: IfNotPresent

  # Monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      namespace: thanos-ns
      labels:
        release: prometheus
