receiver:
  # Global settings
  global:
    namespace: thanos-ns

  # Disable all components except receive
  query:
    enabled: false
  queryFrontend:
    enabled: false
  bucketweb:
    enabled: false
  compactor:
    enabled: false
  storegateway:
    enabled: false
  ruler:
    enabled: false
  receiveDistributor:
    enabled: false

  # Enable receive component
  receive:
    enabled: true

    # Service Account configuration (removed EKS-specific annotation for k3d)
    serviceAccount:
      create: true
      name: thanos-receiver-sa
      # The eks.amazonaws.com/role-arn annotation is removed for k3d clusters.

    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m

    # TSDB retention - how long to retain raw samples on Thanos Receiver's local TSDB
    tsdbRetention: 2d

    # Extra flags for the thanos receive command
    extraFlags:
      - --tsdb.max-exemplars=100000  # Correct flag for enabling exemplars
      - --objstore.config-file=/etc/thanos/objstore.yml

    # Persistence configuration
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi

    # Service configuration
    service:
      type: ClusterIP
      ports:
        http: 10902
        grpc: 10901
        remote: 19291

    # Configure for remote write endpoint
    replicaLabel: replica

    # Auto-scaling configuration
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: 80

    # Inject the AWS credentials from the 'aws-creds' Secret as environment variables
    extraEnvVarsSecret: aws-creds

    # Volume mounts for the object storage configuration file
    extraVolumeMounts:
      - name: objstore-config
        mountPath: /etc/thanos/objstore.yml
        subPath: objstore.yml

    # Define the volume for the object storage configuration ConfigMap
    extraVolumes:
      - name: objstore-config
        configMap:
          name: thanos-receiver-objstore-config

  # Common configuration
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.39.1-debian-12-r0
    pullPolicy: IfNotPresent

  # Monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      namespace: thanos-ns
      labels:
        release: prometheus
