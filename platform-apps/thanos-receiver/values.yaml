receiver:
  # Global settings
  global:
    namespace: thanos-ns
  
  # Disable all components except receive
  query:
    enabled: false
  queryFrontend:
    enabled: false
  bucketweb:
    enabled: false
  compactor:
    enabled: false
  storegateway:
    enabled: false
  ruler:
    enabled: false
  receiveDistributor:
    enabled: false
  
  # Enable receive component
  receive:
    enabled: true
    # The 'mode' field is not a standard value in the Bitnami chart.
    # The chart implicitly runs in 'standalone' mode with a single replica.

    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m

    tsdb:
      retention: 2d # how long to retain raw samples on the local storage

    # Extra flags for the thanos receive command
    extraFlags:
      - --tsdb.max-exemplars=100000  # Correct flag for enabling exemplars

    # Persistence configuration
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi

    # Service configuration
    service:
      type: ClusterIP
      ports:
        http: 10902
        grpc: 10901
        remote: 19291

    # Configure for remote write endpoint
    replicaLabel: replica

    # Auto-scaling configuration
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: 80

  # Object store configuration (using filesystem for simplicity)
  # In production, this should be an external object store like S3 or GCS.
  objstoreConfig: |
    type: FILESYSTEM
    config:
      directory: "/data/objstore"
  
  # Common configuration
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.39.1-debian-12-r0
    pullPolicy: IfNotPresent
  
  # Monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      namespace: thanos-ns
      labels:
        release: prometheus