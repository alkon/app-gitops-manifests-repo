receiver:
  # The objstore configuration will now be managed via a ConfigMap.
  # We are REMOVING existingObjstoreSecret and existingObjstoreSecretItems
  # as they are for a different objstore.yml file approach.

  # Global settings
  global:
    namespace: thanos-ns

  # Disable all components except receive
  query:
    enabled: false
  queryFrontend:
    enabled: false
  bucketweb:
    enabled: false
  compactor:
    enabled: false
  storegateway:
    enabled: false
  ruler:
    enabled: false
  receiveDistributor:
    enabled: false

  # Enable receive component
  receive:
    enabled: true

    # Service Account configuration (removed EKS-specific annotation for k3d)
    serviceAccount:
      create: true
      name: thanos-receiver-sa
      # Removed: eks.amazonaws.com/role-arn annotation as it's for EKS IRSA

    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m

    tsdb:
      retention: 2d # how long to retain raw samples on Thanos Receiver Time Series Database (TSDB), that placed localy

    # Extra flags for the thanos receive command
    extraFlags:
      - --tsdb.max-exemplars=100000  # Correct flag for enabling exemplars
      # Point Thanos to the mounted object storage configuration file
      - --objstore.config-file=/etc/thanos/objstore.yml

    # Persistence configuration
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi

    # Service configuration
    service:
      type: ClusterIP
      ports:
        http: 10902
        grpc: 10901
        remote: 19291

    # Configure for remote write endpoint
    replicaLabel: replica

    # Auto-scaling configuration
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: 80

    # Inject the AWS credentials from the 'aws-creds' Secret as environment variables
    extraEnvFrom:
      - secretRef:
          name: aws-creds # Name of the Secret created by Sealed Secrets

    # Volume mounts for the object storage configuration file
    extraVolumeMounts:
      - name: objstore-config
        mountPath: /etc/thanos/objstore.yml
        subPath: objstore.yml # Mounts only the file, not the directory

    # Define the object storage configuration structure here, nested under 'receive'
    objstore:
      type: S3
      config:
        bucket: alkon-thanos-metrics-dev
        endpoint: s3.amazonaws.com
        region: us-east-1
        # Add other S3 specific configs if needed, e.g., insecure: true, signature_version2: false

  # Define the volume for the object storage configuration ConfigMap (MOVED HERE)
  extraVolumes: # MOVED from top-level to under 'receiver'
    - name: objstore-config
      configMap:
        name: {{ include "thanos-receiver-app.fullname" . }}-objstore-config

  # Common configuration (this section remains at the top level of 'receiver')
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.39.1-debian-12-r0
    pullPolicy: IfNotPresent

  # Monitoring (this section remains at the top level of 'receiver')
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      namespace: thanos-ns
      labels:
        release: prometheus
