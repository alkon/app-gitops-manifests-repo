receiver:
  # Global settings
  global:
    namespace: thanos-ns
  
  # Disable all components except receive
  query:
    enabled: false
  queryFrontend:
    enabled: false
  bucketweb:
    enabled: false
  compactor:
    enabled: false
  storegateway:
    enabled: false
  ruler:
    enabled: false
  receiveDistributor:
    enabled: false
  
  # Enable receive component
  receive:
    enabled: true
    mode: "standalone"
    
    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m
    
    # Enable exemplars support
    extraFlags:
      - --receive.exemplars=on
      - --tsdb.max-exemplars=100000
      - --tsdb.retention=2d
    
    # Persistence configuration
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi
    
    # Service configuration
    service:
      type: ClusterIP
      ports:
        http: 10902
        grpc: 10901
        remote: 19291
    
    # Configure for remote write endpoint
    replicaLabel: replica
    
    # Auto-scaling configuration
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: 80
  
  # Object store configuration (using filesystem for simplicity)
  # In production, configure S3, GCS, or Azure
  objstoreConfig: |
    type: FILESYSTEM
    config:
      directory: "/data/objstore"
  
  # Common configuration
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.39.1-debian-12-r0
    pullPolicy: IfNotPresent
  
  # Monitoring
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: thanos-ns
      labels:
        release: prometheus