receiver:
  # Global settings
  global:
    namespace: thanos-ns

  # Disable all components except receive
  query:
    enabled: false
  queryFrontend:
    enabled: false
  bucketweb:
    enabled: false
  compactor:
    enabled: false
  storegateway:
    enabled: false
  ruler:
    enabled: false
  receiveDistributor:
    enabled: false

  # Enable receive component
  receive:
    enabled: true

    # Service Account configuration (removed EKS-specific annotation for k3d)
    serviceAccount:
      create: true
      name: thanos-receiver-sa
      # The eks.amazonaws.com/role-arn annotation is removed for k3d clusters.

    # Resource configuration
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m

    tsdb:
      # Only one retention line, as duplicate keys cause YAML parsing errors.
      retention: 2d # how long to retain raw samples on Thanos Receiver's local TSDB

    # Extra flags for the thanos receive command
    extraFlags:
      - --tsdb.max-exemplars=100000  # Correct flag for enabling exemplars
      # Pass S3 object storage configuration directly via flags using a YAML literal block scalar.
      # IMPORTANT: The content below the '|' MUST be indented by at least 2 spaces
      # relative to the line containing '--objstore.config=|'.
      - --objstore.config=|
          type: S3
          config:
            bucket: alkon-thanos-metrics-dev
            endpoint: s3.amazonaws.com
            region: us-east-1
      # Make sure 'alkon-thanos-metrics-dev' and 'us-east-1' match your actual bucket name and region.

    # Persistence configuration
    persistence:
      enabled: true
      storageClass: "standard"
      size: 10Gi

    # Service configuration
    service:
      type: ClusterIP
      ports:
        http: 10902
        grpc: 10901
        remote: 19291

    # Configure for remote write endpoint
    replicaLabel: replica

    # Auto-scaling configuration
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: 80

    # Inject the AWS credentials from the 'aws-creds' Secret as environment variables
    extraEnvFrom:
      - secretRef:
          name: aws-creds # Name of the Secret created by Sealed Secrets

  # Common configuration (this section remains at the top level of 'receiver')
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.39.1-debian-12-r0
    pullPolicy: IfNotPresent

  # Monitoring (this section remains at the top level of 'receiver')
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
      namespace: thanos-ns
      labels:
        release: prometheus
